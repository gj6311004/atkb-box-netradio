name: Build NetRadio Firmware

# 在 GitHub 云端编译, 本地无需安装 PlatformIO / ESP-IDF
# 触发: 手动、push 到任意分支、或修改源码的 PR
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PlatformIO
        run: pip install platformio

      # 缓存平台/工具链/库, 让后续编译快很多
      - name: 缓存 PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/libdeps
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: 编译固件
        run: pio run -e atkb-box

      # 把 bootloader + 分区表 + 应用 合成一个 0x0 起始的整片固件,
      # 烧录时只需一个文件, 地址 0x0
      - name: 安装 esptool
        run: pip install esptool

      - name: 合并为单文件固件
        run: |
          python -m esptool --chip esp32s3 merge-bin \
            -o atkb-box-netradio-16MB.bin \
            --flash-mode dio --flash-size 16MB --flash-freq 80m \
            0x0 .pio/build/atkb-box/bootloader.bin \
            0x8000 .pio/build/atkb-box/partitions.bin \
            0x10000 .pio/build/atkb-box/firmware.bin

      # 整理到 dist/: 既有整片合并固件, 也有可分文件烧录的 app/分区表/bootloader
      # 分文件烧录可只刷 app0(0x10000) 而保留 NVS(0x9000) 里的 WiFi 配置
      - name: 整理固件产物
        run: |
          mkdir -p dist
          cp atkb-box-netradio-16MB.bin dist/
          cp .pio/build/atkb-box/firmware.bin dist/app-atkb-box.bin
          cp .pio/build/atkb-box/partitions.bin dist/partitions.bin
          cp .pio/build/atkb-box/bootloader.bin dist/bootloader.bin
          ls -lh dist/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: atkb-box-netradio-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 90
