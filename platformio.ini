; ============================================================
; 正点原子 ATK-DNESP32S3-BOX V1.1 网络收音机
; 主控: ESP32-S3R8 (N16R8, 16MB Flash + 8MB Octal PSRAM)
; 屏幕: 320x240 ST7789, 8-bit i8080 并口
; 音频: ES8311 (I2C 0x18, 无独立 MCLK, 从 BCLK 恢复)
; 扩展IO: XL9555 (I2C 0x20) - 功放/背光/按键
; 基于: zhuhai-esp/ESP32-S3-AmourK08-4Keys (K08-4Keys-NetRadio) 修改
; ============================================================

[env:atkb-box]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB Flash (DIO) + 8MB PSRAM (OPI/Octal)
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.8
    lovyan03/LovyanGFX @ 1.2.36

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
